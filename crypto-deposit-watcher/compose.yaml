services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: watcher
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher_dev_only
    ports:
      - "5433:5432"
    volumes:
      - watcher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher -d watcher"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
  watcher:
    build: .
    command: ["python", "manage.py", "watch_chain"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  watcher_pgdata:
