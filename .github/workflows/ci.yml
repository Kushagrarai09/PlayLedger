name: PlayLedger CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: playledger_test
          POSTGRES_USER: playledger
          POSTGRES_PASSWORD: playledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playledger -d playledger_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      DB_NAME: playledger_test
      DB_USER: playledger
      DB_PASSWORD: playledger_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: pytest
